name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Continuous integration]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      packages: read
    uses: hexadrop/github-workflows/.github/workflows/check.yml@v1.13.0
    with:
      commands: '["lint:ci","typecheck","typecheck:astro"]'
      cache-commands: '["lint:ci"]'
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      registry: github
      registry-scope: '@mariomh8'
    secrets:
      registry-token: ${{ secrets.PACKAGES_TOKEN }}

  release:
    name: Deploy
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mariomh8'

      - name: Export GitHub Packages token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        run: echo "NODE_AUTH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=terminal-mariomh
